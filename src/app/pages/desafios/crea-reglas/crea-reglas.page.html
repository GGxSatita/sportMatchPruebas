<app-header></app-header>
<ion-content class="ion-padding">
  <ion-row>
    <ion-col size="12">
      <form [formGroup]="reglasForm">
        <!-- Campos del formulario -->
        <ion-item>
          <ion-label position="stacked">Puntos para ganar</ion-label>
          <ion-input formControlName="pointsToWin" type="number"></ion-input>
        </ion-item>
        <ion-item>
          <ion-label position="stacked">Reglas Adicionales</ion-label>
          <ion-input formControlName="reglasAdicionales"></ion-input>
        </ion-item>

        <!-- Botón para guardar reglas -->
        <ion-button
          expand="full"
          [disabled]="botonConfigurarDesafioDisabled"
          (click)="guardarReglas()"
        >
          Configurar Reglas
        </ion-button>
      </form>
    </ion-col>
  </ion-row>
</ion-content>
<app-footer></app-footer>
