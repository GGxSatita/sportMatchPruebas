<app-header></app-header>
<ion-content class="ion-padding">
  <ion-row>
    <ion-col size="12">
      <form [formGroup]="reglasForm">
        <!-- Selección de puntos para ganar -->
        <ion-item>
          <ion-label position="stacked">Puntos para ganar</ion-label>
          <ion-select formControlName="pointsToWin">
            <ion-select-option *ngFor="let point of puntos" [value]="point">
              {{ point }}
            </ion-select-option>
          </ion-select>
        </ion-item>

        <!-- Campo para reglas adicionales -->
        <ion-item>
          <ion-label position="stacked">Reglas Adicionales</ion-label>
          <ion-input formControlName="reglasAdicionales"></ion-input>
        </ion-item>

        <!-- Selección de juego por equipos -->
        <ion-item>
          <ion-label>Juego por equipos</ion-label>
          <ion-toggle formControlName="esPorEquipos"></ion-toggle>
        </ion-item>

        <!-- Botón para guardar reglas -->
        <ion-button
          expand="full"
          [disabled]="botonConfigurarDesafioDisabled"
          (click)="guardarReglas()"
        >
          Configurar Reglas
        </ion-button>
      </form>
    </ion-col>
  </ion-row>
</ion-content>
<app-footer></app-footer>
