<app-header></app-header>

<ion-content>
  <div class="container">
    <!-- Nombre del evento -->
    <h1 class="title">Enfrentamiento: {{ eventName }}</h1>

    <!-- Mostrar puntos para ganar -->
    <div *ngIf="maxPoints" class="info-container">
      <p><strong>Puntos para ganar:</strong> {{ maxPoints }}</p>
    </div>

    <!-- Lista de participantes -->
    <div class="equipos-container">
      <div class="equipo">
        <h3>Participantes</h3>
        <ion-list>
          <ion-item
            *ngFor="let participante of participantes"
            [id]="'card-' + participante.id"
            [class.animate-points]="participante.id === animatingParticipantId"
            [class.ganador]="participante.name === ganador"
          >
            <!-- Foto de perfil del participante -->
            <ion-avatar slot="start">
              <img
                [src]="participante.photo || 'assets/default-profile.png'"
                (error)="handleImageError($event)"
                alt="{{ participante.name }}"
              />
            </ion-avatar>
            <ion-label>
              <h2>{{ participante.name }}</h2>
              <p>Puntaje: {{ participante.score }}</p>
            </ion-label>
          </ion-item>
        </ion-list>
      </div>
    </div>

    <!-- Botón Ronda Ganada -->
    <div class="ronda-container">
      <ion-button expand="block" color="success" (click)="incrementarRonda()">
        Ronda Ganada
      </ion-button>
    </div>

    <!-- Mensaje de ganador -->
    <div *ngIf="ganador" class="ganador-container animate-winner">
      <h2>¡El ganador es: {{ ganador }}!</h2>
    </div>

    <!-- Botones de navegación -->
    <div class="action-buttons">
      <ion-button expand="block" color="primary" (click)="volverAlInicio()">Home</ion-button>
      <ion-button expand="block" color="secondary" (click)="volverAListaEventos()">Eventos</ion-button>
    </div>
  </div>
</ion-content>

<app-footer></app-footer>
