<app-header></app-header>

<ion-content class="weather-content">
  <div class="weather-info" [ngClass]="weatherClass">
    <ion-icon class="weather-icon" [name]="weatherIcon"></ion-icon>
    <h1 class="temperature">{{ temperature }}°C</h1>
    <p class="description">{{ description | titlecase }}</p>
  </div>

  <!-- Tarjetas de información adicional con ion-grid -->
  <ion-grid>
    <ion-row>
      <ion-col size="6" size-md="3" *ngFor="let card of weatherCards">
        <ion-card class="weather-card">
          <ion-icon [name]="card.icon"></ion-icon>
          <div>{{ card.label }}: {{ card.value }}</div>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
