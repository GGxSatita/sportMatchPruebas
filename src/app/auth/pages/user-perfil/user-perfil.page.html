<app-header></app-header>

<ion-content class="profile-content ion-padding fondo-app">
  <!-- Spinner de carga mientras se obtienen los datos -->
  <ion-spinner *ngIf="cargando"></ion-spinner>

  <!-- Card de perfil de usuario -->
  <ion-card *ngIf="!cargando && user" class="profile-card">
    <div class="image-wrapper">
      <img
        [src]="user?.photo || 'assets/img/default-profile.png'"
        alt="Foto de perfil del usuario"
        (error)="handleImageError($event)"
        class="profile-image"
      />
    </div>

    <ion-card-content>
      <!-- Nombre del Usuario -->
      <h2 class="user-name">{{ user?.name || 'Nombre no disponible' }}</h2>

      <!-- Información del Usuario -->
      <ion-grid class="info-grid">
        <ion-row>
          <ion-col size="12" size-md="6">
            <ion-item lines="none" class="info-item">
              <ion-icon name="mail-outline" slot="start" class="info-icon"></ion-icon>
              <p>{{ user?.email }}</p>
            </ion-item>
          </ion-col>
          <ion-col size="12" size-md="6" *ngIf="userProfile?.edad">
            <ion-item lines="none" class="info-item">
              <ion-icon name="calendar-outline" slot="start" class="info-icon"></ion-icon>
              <p>{{ userProfile.edad }} años</p>
            </ion-item>
          </ion-col>
          <ion-col size="12" size-md="6" *ngIf="userProfile?.deporteFavorito">
            <ion-item lines="none" class="info-item">
              <ion-icon name="star-outline" slot="start" class="info-icon"></ion-icon>
              <p>{{ userProfile.deporteFavorito }}</p>
            </ion-item>
          </ion-col>
        </ion-row>
      </ion-grid>

      <!-- Botones de acción -->
      <ion-row class="action-row ion-margin-top">
        <ion-col size="6">
          <ion-button expand="block" fill="outline" color="primary" (click)="goToEditProfile()">
            <ion-icon name="create-outline" slot="start"></ion-icon>
          </ion-button>
        </ion-col>
        <ion-col size="6">
          <ion-button expand="block" fill="outline" color="secondary" (click)="goToCambiarContrasena()">
            <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
          </ion-button>
        </ion-col>
      </ion-row>
    </ion-card-content>
  </ion-card>
</ion-content>

<app-footer></app-footer>
